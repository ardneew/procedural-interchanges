<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(56,189,248,0.06)" stroke-width="1.5">
    <line x1="256" y1="40" x2="256" y2="472" />
    <line x1="40" y1="256" x2="472" y2="256" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="80" fill="none" />
  </g>

  <!-- Concept 6: Dynamic 4-Way Directional Turbine Interchange -->
  <g filter="url(#glow)">
    <!-- Arm 1: North to East -->
    <path d="M 256 64 C 256 170, 340 212, 448 212" fill="none" stroke="url(#skyGrad)" stroke-width="36" stroke-linecap="round" />
    <!-- Arm 2: East to South -->
    <path d="M 448 256 C 340 256, 298 340, 298 448" fill="none" stroke="url(#indigoGrad)" stroke-width="36" stroke-linecap="round" />
    <!-- Arm 3: South to West -->
    <path d="M 256 448 C 256 340, 170 298, 64 298" fill="none" stroke="url(#skyGrad)" stroke-width="36" stroke-linecap="round" />
    <!-- Arm 4: West to North -->
    <path d="M 64 256 C 170 256, 212 170, 212 64" fill="none" stroke="url(#indigoGrad)" stroke-width="36" stroke-linecap="round" />

    <!-- Central Grade Hub -->
    <circle cx="256" cy="256" r="38" fill="#f8fafc" stroke="#0f172a" stroke-width="8" />
  </g>
</svg>
